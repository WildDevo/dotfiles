set-option -sa terminal-overrides ",xterm*:Tc"

set-window-option -g xterm-keys on

set-option -g default-shell /bin/zsh

# action key
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings

bind -n C-a send-prefix
set-window-option -g mode-keys vi

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Reload settings
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open #{pane_current_path}"

# Switch to last window
bind Tab last-window

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resizing pane
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle # block selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel \; run-shell "tmux show-buffer | pbcopy"
bind-key -T copy-mode-vi '/' send -X search-backward # search in copy mode

set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane

#### basic settings

set-option -g history-limit 64096

set -sg escape-time 0
set -g display-time 2000
set -g display-panes-time 2000
set -g automatic-rename on

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#latest'

# Catppuccin
set -g @catppuccin_flavor 'frappe'

# Window list — rounded pills, current window stands out
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Uniform pill: both halves share the same bg per state
set -g @catppuccin_window_number_color "#{@thm_overlay_0}"
set -g @catppuccin_window_text_color "#{@thm_overlay_0}"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"
set -g @catppuccin_window_current_text_color "#{@thm_blue}"

# Initialize TMUX plugin manager (must run before status assembly below)
run '~/.config/tmux/plugins/tpm/tpm'

# Status modules — assembled after tpm so @thm_* and modules are defined
set -g status-justify "centre"
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_session}"

set -g pane-active-border-style "fg=#{@thm_blue}"
set -g pane-border-style "fg=#{@thm_overlay_0}"
