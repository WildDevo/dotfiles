set-option -sa terminal-overrides ",xterm*:Tc"

set-window-option -g xterm-keys on

set-option -g default-shell /bin/zsh

# action key
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings

bind -n C-a send-prefix
set-window-option -g mode-keys vi

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Reload settings
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open #{pane_current_path}"

# Switch to last window
bind Tab last-window

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resizing pane
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle # block selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel \; run-shell "tmux show-buffer | pbcopy"
bind-key -T copy-mode-vi '/' send -X search-backward # search in copy mode

set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane

#### basic settings

set-option -g history-limit 64096

set -sg escape-time 0
set -g display-time 2000
set -g display-panes-time 2000
set -g automatic-rename on

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wildDevo/tmux-catppuccin'

# Catppuccin theme configuration
set -g @catppuccin_flavour 'frappe'

# Window separators - rounded pill shape
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_separator " "

# Window styling
set -g @catppuccin_window_default_fill "all"
set -g @catppuccin_window_default_color "#{thm_gray}"
set -g @catppuccin_window_default_background "#{thm_bg}"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_color "#{thm_cyan}"
set -g @catppuccin_window_current_background "#{thm_bg}"
set -g @catppuccin_window_current_text "#W"

# Pane configuration
set -g @catppuccin_pane_status_enable "no"
set -g @catppuccin_pane_active_border_style "fg=#{thm_blue}"

# Status line configuration
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_status_justify "centre"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
